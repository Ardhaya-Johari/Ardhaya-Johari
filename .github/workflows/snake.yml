name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Snake SVG
    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ardhaya-Johari
          outputs: |
            ./output/github-snake-dark.svg
          args: >
            --palette dark
            --color_snake "#00FF00"
            --color_dots "#ff69b4"

      - name: Push Snake to GitHub
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
