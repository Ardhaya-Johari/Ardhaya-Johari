name: generate pacman game

on:
  schedule:
    - cron: "0 0 * * *"   # runs once every 24 hours at midnight UTC
  workflow_dispatch:       # allows manual run
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Generate Pacman contribution graph
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Ardhaya-Johari  # replace with your username
          theme: light                      # optional: use 'dark' for dark mode

      # Step 3: Debug - check generated files
      - name: List generated files
        run: |
          echo "Workspace contents:"
          ls -R
          echo "Dist folder contents:"
          ls -R dist || echo "dist folder not found!"

      # Step 4: Push to output branch
      - name: Push pacman-contribution-graph.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
